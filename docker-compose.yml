# Orquestacion local con Docker Compose (Docker Desktop en Windows).
#
# IMPORTANTE: PostgreSQL NO corre en Docker. Es un servicio instalado y en
# ejecucion en el host de Windows. Por eso aqui SOLO se definen dos servicios
# (frontend y backend); no hay servicio `db` ni seccion `volumes`.
#
# El backend, desde su contenedor, alcanza la PostgreSQL del host mediante el
# nombre especial host.docker.internal:5432 (dentro de un contenedor,
# `localhost` apunta al propio contenedor, no al host).
#
# No se incluye la clave `version:` porque esta obsoleta en Compose v2.

services:
  backend:
    build: ./backend
    environment:
      # Cadena de conexion a la PostgreSQL del host (host.docker.internal:5432).
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    # En Docker Desktop para Windows, host.docker.internal ya esta disponible
    # por defecto. Si en algun entorno no resolviera, puede agregarse:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    environment:
      # URL del backend que consume el frontend (puerto publicado en el host).
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
